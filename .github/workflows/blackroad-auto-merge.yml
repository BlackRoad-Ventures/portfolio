name: Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    name: Auto-Merge PRs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get PR Details
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get PR number
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          elif [ -n "${{ github.event.workflow_run.pull_requests[0].number }}" ]; then
            PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
          else
            # Find open PRs
            PR_NUMBER=$(gh pr list --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR found, exiting..."
            echo "number=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT

          # Get PR status
          PR_DATA=$(gh pr view "$PR_NUMBER" --json statusCheckRollup,headRefName,mergeable,mergeStateStatus,labels)

          MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable')
          MERGE_STATE=$(echo "$PR_DATA" | jq -r '.mergeStateStatus')
          BRANCH=$(echo "$PR_DATA" | jq -r '.headRefName')

          # Check if all checks passed
          ALL_PASSED="true"
          PENDING=$(echo "$PR_DATA" | jq '[.statusCheckRollup[] | select(.conclusion == null or .conclusion == "PENDING")] | length')
          FAILED=$(echo "$PR_DATA" | jq '[.statusCheckRollup[] | select(.conclusion == "FAILURE" or .conclusion == "ERROR")] | length')

          if [ "$FAILED" -gt 0 ]; then
            ALL_PASSED="false"
          fi
          if [ "$PENDING" -gt 0 ]; then
            ALL_PASSED="pending"
          fi

          echo "mergeable=$MERGEABLE" >> $GITHUB_OUTPUT
          echo "merge_state=$MERGE_STATE" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "all_passed=$ALL_PASSED" >> $GITHUB_OUTPUT

          echo "PR #$PR_NUMBER: mergeable=$MERGEABLE, checks=$ALL_PASSED, branch=$BRANCH"

      - name: Validate PR for Auto-Merge
        id: validate
        if: steps.pr.outputs.number != ''
        run: |
          CAN_MERGE="false"

          # Check 1: All checks passed?
          if [[ "${{ steps.pr.outputs.all_passed }}" == "true" ]]; then
            echo "All checks passed"

            # Check 2: Is mergeable (no conflicts)?
            if [[ "${{ steps.pr.outputs.mergeable }}" == "MERGEABLE" ]]; then
              echo "PR is mergeable"
              CAN_MERGE="true"
            else
              echo "PR has merge conflicts"
            fi
          else
            echo "Checks not passing: ${{ steps.pr.outputs.all_passed }}"
          fi

          echo "can_merge=$CAN_MERGE" >> $GITHUB_OUTPUT

      - name: Enable Auto-Merge
        if: steps.validate.outputs.can_merge == 'true' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"

          echo "Merging PR #$PR_NUMBER..."

          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --body "Auto-merged — all CI checks passed.

Merged by BlackRoad Auto-Merge System." || echo "Merge attempted — may require manual approval"

          echo "PR #$PR_NUMBER merge initiated"

      - name: Comment on Merge
        if: steps.validate.outputs.can_merge == 'true' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" \
            --body "**Auto-Merge:** All CI checks passed. PR merged." || true
